  <body class="reader-page">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./index.html">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/logo-mark.png" alt="" />

        </nav>
      </header>

      <main class="reader-page-main solo-reader" id="reader-article">
        <section class="reader-page-article">
          <div class="reader-toolbar">
            <div class="reader-toolbar-copy">
              <p class="toolbar-kicker">当前文稿</p>
              <h2 id="reader-title">加载中</h2>
              <p class="reader-summary" id="reader-summary"></p>
              <div class="reader-statusbar" id="reader-statusbar">
                <p class="loading-text">正在准备状态信息…</p>
              </div>
            </div>
            <div class="reader-actions">
              <div class="reader-preferences">
                <div class="reader-mode-picker" id="reader-mode-picker" role="radiogroup" aria-label="阅读内容选项">
                  <button
                    class="reader-mode-option"
                    id="reader-mode-parallel"
                    type="button"
                    role="radio"
                    aria-checked="true"
                    data-reading-mode-value="parallel"
                  >
                    原文和现代语译
                  </button>
                  <button
                    class="reader-mode-option"
                    id="reader-mode-original"
                    type="button"
                    role="radio"
                    aria-checked="false"
                    data-reading-mode-value="original"
                  >
                    只读原文
                  </button>
                  <button
                    class="reader-mode-option"
                    id="reader-mode-translation"
                    type="button"
                    role="radio"
                    aria-checked="false"
                    data-reading-mode-value="translation"
                  >
                    只读现代语译
                  </button>
                </div>
                <div class="reader-font-picker" id="reader-font-picker" role="radiogroup" aria-label="字体大小选项">
                  <button
                    class="reader-font-option"
                    type="button"
                    role="radio"
                    aria-checked="true"
                    data-font-size-value="default"
                  >
                    默认字号
                  </button>
                  <button
                    class="reader-font-option"
                    type="button"
                    role="radio"
                    aria-checked="false"
                    data-font-size-value="large"
                  >
                    大一号
                  </button>
                  <button
                    class="reader-font-option"
                    type="button"
                    role="radio"
                    aria-checked="false"
                    data-font-size-value="xlarge"
                  >
                    大两号
                  </button>
                </div>
              </div>
              <a class="source-link" id="source-link" href="#" target="_blank" rel="noreferrer">打开 Markdown 原稿</a>
            </div>
          </div>

            <div class="reader-surface reader-surface-solo">
              <nav class="reader-volume-nav" id="reader-volume-nav-top" aria-label="卷数导航" hidden></nav>
              <article class="markdown-view reading-prose" id="reader-rendered">
                <p class="loading-text">正在渲染文稿…</p>
              </article>
              <nav class="reader-volume-nav reader-volume-nav-bottom" id="reader-volume-nav-bottom" aria-label="卷数导航" hidden></nav>
            <details class="raw-source">
              <summary>查看原始 Markdown</summary>
              <pre id="reader-raw"></pre>
            </details>
            <div id="tcomment"></div>
          </div>
        </section>
      </main>
    </div>

    <button
      class="selection-comment-trigger"

          fill="currentColor"
        />
      </svg>
    </button>
